# Wined — production / staging compose for Dokploy
#
# Reverse proxy: Dokploy → Traefik (already running on the host).
# Domains are exposed via *.15.237.213.46.nip.io (HTTP for now; HTTPS when
# wined.es / wined.app land).
#
# Variables expected in Dokploy "Environment" tab (NOT committed to repo):
#   POSTGRES_PASSWORD          random strong secret
#   ANTHROPIC_API_KEY          sk-ant-...
#   COHERE_API_KEY             ...
#   JWT_SECRET                 32+ chars (openssl rand -hex 32)
#   JWT_REFRESH_SECRET         32+ chars (openssl rand -hex 32), optional
#   LANGFUSE_PUBLIC_KEY        pk-lf-...
#   LANGFUSE_SECRET_KEY        sk-lf-...
#   POSTHOG_API_KEY            phc_...
#   APIFY_API_TOKEN            apify_api_...
#   RESEND_API_KEY             re_...
#   WINED_DOMAIN_SUFFIX        e.g. "15.237.213.46.nip.io"

name: wined

x-common-env: &common-env
  NODE_ENV: production
  DATABASE_URL: postgres://wined:${POSTGRES_PASSWORD:?missing}@postgres:5432/wined
  REDIS_URL: redis://redis:6379
  S3_ENDPOINT: http://minio:9000
  S3_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
  S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?missing}
  S3_REGION: us-east-1
  OBJECT_STORE_BUCKET: wined-uploads
  JWT_SECRET: ${JWT_SECRET:?missing}
  JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-}
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:?missing}
  COHERE_API_KEY: ${COHERE_API_KEY:?missing}
  EMBEDDING_PROVIDER: cohere
  LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
  LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
  LANGFUSE_BASE_URL: http://langfuse:3000
  POSTHOG_API_KEY: ${POSTHOG_API_KEY:-}
  POSTHOG_HOST: https://eu.posthog.com
  APIFY_API_TOKEN: ${APIFY_API_TOKEN:-}
  RESEND_API_KEY: ${RESEND_API_KEY:-}
  WINED_API_URL: https://wined-api.${WINED_DOMAIN_SUFFIX:-15.237.213.46.nip.io}

services:
  # ────────────────────────────────────────────────────────────
  # DATABASE — Postgres 16 with pgvector
  # ────────────────────────────────────────────────────────────
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: wined
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?missing}
      POSTGRES_DB: wined
    volumes:
      - wined_pg_data:/var/lib/postgresql/data
      - ./infra/sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U wined -d wined']
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - dokploy-network

  # ────────────────────────────────────────────────────────────
  # REDIS — cache + BullMQ queues
  # ────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes --save 60 1
    volumes:
      - wined_redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - dokploy-network

  # ────────────────────────────────────────────────────────────
  # OBJECT STORAGE — Minio (S3-compatible)
  # ────────────────────────────────────────────────────────────
  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?missing}
    volumes:
      - wined_minio_data:/data
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9000/minio/health/live']
      interval: 30s
      timeout: 5s
      retries: 5
    networks:
      - dokploy-network
    labels:
      - 'traefik.enable=true'
      - 'traefik.http.routers.wined-minio.rule=Host(`wined-minio.${WINED_DOMAIN_SUFFIX:-15.237.213.46.nip.io}`)'
      - 'traefik.http.routers.wined-minio.entrypoints=web'
      - 'traefik.http.services.wined-minio.loadbalancer.server.port=9001'

  # ────────────────────────────────────────────────────────────
  # LANGFUSE — LLM observability
  # ────────────────────────────────────────────────────────────
  langfuse:
    image: langfuse/langfuse:latest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://wined:${POSTGRES_PASSWORD:?missing}@postgres:5432/wined
      NEXTAUTH_SECRET: ${LANGFUSE_NEXTAUTH_SECRET:?missing}
      SALT: ${LANGFUSE_SALT:?missing}
      NEXTAUTH_URL: https://wined-langfuse.${WINED_DOMAIN_SUFFIX:-15.237.213.46.nip.io}
      TELEMETRY_ENABLED: 'false'
    networks:
      - dokploy-network
    labels:
      - 'traefik.enable=true'
      - 'traefik.http.routers.wined-langfuse.rule=Host(`wined-langfuse.${WINED_DOMAIN_SUFFIX:-15.237.213.46.nip.io}`)'
      - 'traefik.http.routers.wined-langfuse.entrypoints=web'
      - 'traefik.http.services.wined-langfuse.loadbalancer.server.port=3000'

  # ────────────────────────────────────────────────────────────
  # API — Hono backend
  # ────────────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
    environment:
      <<: *common-env
      PORT: 8787
      WINED_START_WORKERS: '1'
    networks:
      - dokploy-network
    labels:
      - 'traefik.enable=true'
      - 'traefik.http.routers.wined-api.rule=Host(`wined-api.${WINED_DOMAIN_SUFFIX:-15.237.213.46.nip.io}`)'
      - 'traefik.http.routers.wined-api.entrypoints=web'
      - 'traefik.http.services.wined-api.loadbalancer.server.port=8787'

  # ────────────────────────────────────────────────────────────
  # SOMMELIER WEB — Next.js (vertical sala)
  # ────────────────────────────────────────────────────────────
  sommelier-web:
    build:
      context: .
      dockerfile: apps/sommelier-web/Dockerfile
    restart: unless-stopped
    depends_on:
      - api
    environment:
      <<: *common-env
      PORT: 3000
    networks:
      - dokploy-network
    labels:
      - 'traefik.enable=true'
      - 'traefik.http.routers.wined-sommelier.rule=Host(`wined.${WINED_DOMAIN_SUFFIX:-15.237.213.46.nip.io}`) || Host(`wined-sommelier.${WINED_DOMAIN_SUFFIX:-15.237.213.46.nip.io}`)'
      - 'traefik.http.routers.wined-sommelier.entrypoints=web'
      - 'traefik.http.services.wined-sommelier.loadbalancer.server.port=3000'

  # ────────────────────────────────────────────────────────────
  # CELLAR WEB — Next.js (vertical bodega/enólogo)
  # ────────────────────────────────────────────────────────────
  cellar-web:
    build:
      context: .
      dockerfile: apps/cellar-web/Dockerfile
    restart: unless-stopped
    depends_on:
      - api
    environment:
      <<: *common-env
      PORT: 3000
    networks:
      - dokploy-network
    labels:
      - 'traefik.enable=true'
      - 'traefik.http.routers.wined-cellar.rule=Host(`wined-cellar.${WINED_DOMAIN_SUFFIX:-15.237.213.46.nip.io}`)'
      - 'traefik.http.routers.wined-cellar.entrypoints=web'
      - 'traefik.http.services.wined-cellar.loadbalancer.server.port=3000'

  # ────────────────────────────────────────────────────────────
  # DISTRIBUTOR WEB — Next.js (vertical distribución)
  # ────────────────────────────────────────────────────────────
  distributor-web:
    build:
      context: .
      dockerfile: apps/distributor-web/Dockerfile
    restart: unless-stopped
    depends_on:
      - api
    environment:
      <<: *common-env
      PORT: 3000
    networks:
      - dokploy-network
    labels:
      - 'traefik.enable=true'
      - 'traefik.http.routers.wined-distributor.rule=Host(`wined-distributor.${WINED_DOMAIN_SUFFIX:-15.237.213.46.nip.io}`)'
      - 'traefik.http.routers.wined-distributor.entrypoints=web'
      - 'traefik.http.services.wined-distributor.loadbalancer.server.port=3000'

volumes:
  wined_pg_data:
  wined_redis_data:
  wined_minio_data:

networks:
  # Dokploy auto-creates a shared "dokploy-network" connected to Traefik.
  # Marking it external so containers join it without compose creating a new one.
  dokploy-network:
    external: true
