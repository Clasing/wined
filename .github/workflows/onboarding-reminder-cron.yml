name: onboarding-reminder-cron
on:
  # schedule disabled while Wined infra is parked (2026-05-18). Original schedule preserved below — uncomment the two `schedule:` lines to re-arm.
  # schedule:
  #   - cron: '0 9 * * *'   # daily at 09:00 UTC
  workflow_dispatch:

jobs:
  remind:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.11.0'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec turbo run build --filter=@wined/api
      - run: node apps/api/dist/workers/onboarding-reminder-cron.js
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_PROD }}
          REDIS_URL: ${{ secrets.REDIS_URL_PROD }}
          S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
          S3_ACCESS_KEY: ${{ secrets.S3_ACCESS_KEY }}
          S3_SECRET_KEY: ${{ secrets.S3_SECRET_KEY }}
          S3_REGION: ${{ secrets.S3_REGION }}
          OBJECT_STORE_BUCKET: ${{ secrets.OBJECT_STORE_BUCKET }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          CLERK_PUBLISHABLE_KEY: ${{ secrets.CLERK_PUBLISHABLE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          COHERE_API_KEY: ${{ secrets.COHERE_API_KEY }}
          EMBEDDING_PROVIDER: cohere
          LANGFUSE_PUBLIC_KEY: ${{ secrets.LANGFUSE_PUBLIC_KEY }}
          LANGFUSE_SECRET_KEY: ${{ secrets.LANGFUSE_SECRET_KEY }}
          LANGFUSE_BASE_URL: ${{ secrets.LANGFUSE_BASE_URL }}
          POSTHOG_API_KEY: ${{ secrets.POSTHOG_API_KEY }}
          POSTHOG_HOST: ${{ secrets.POSTHOG_HOST }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
