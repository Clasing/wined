name: Build and push images to GHCR

on:
  push:
    branches: [main]
    paths:
      - 'apps/**'
      - 'packages/**'
      - 'pnpm-lock.yaml'
      - 'package.json'
      - 'turbo.json'
      - 'tsconfig.base.json'
      - '.github/workflows/build-and-push.yml'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag override (default: latest + sha)'
        required: false
        type: string

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

jobs:
  build:
    name: build ${{ matrix.app }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: api
            dockerfile: apps/api/Dockerfile
            image: wined-api
          - app: sommelier-web
            dockerfile: apps/sommelier-web/Dockerfile
            image: wined-sommelier-web
          - app: cellar-web
            dockerfile: apps/cellar-web/Dockerfile
            image: wined-cellar-web
          - app: distributor-web
            dockerfile: apps/distributor-web/Dockerfile
            image: wined-distributor-web

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags
        id: tags
        run: |
          OWNER_LC=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          IMAGE="${{ env.REGISTRY }}/${OWNER_LC}/${{ matrix.image }}"
          TAG_SHA="${IMAGE}:${{ github.sha }}"
          TAG_LATEST="${IMAGE}:latest"
          TAG_MAIN="${IMAGE}:main"
          {
            echo "image=${IMAGE}"
            echo "tags=${TAG_SHA},${TAG_LATEST},${TAG_MAIN}"
          } >> "$GITHUB_OUTPUT"
          echo "Building → ${TAG_SHA}, ${TAG_LATEST}, ${TAG_MAIN}"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}
          platforms: linux/amd64

      - name: Print image digest
        run: |
          echo "Built ${{ steps.tags.outputs.image }} (sha-${{ github.sha }})"
